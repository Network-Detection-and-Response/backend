services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ndr
      POSTGRES_PASSWORD: ndr
      POSTGRES_DB: ndr
    ports:
      - "5432:5432"
    volumes:
      - ndr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndr -d ndr"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      # goose reads DSN from the CLI arg below; env kept for documentation/tools.
      DATABASE_URL: postgres://ndr:ndr@postgres:5432/ndr?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["goose", "-dir", "/migrations", "postgres", "postgres://ndr:ndr@postgres:5432/ndr?sslmode=disable", "up"]
    restart: "on-failure"

  # ML is intentionally omitted. Set ML_SERVICE_URL / ML_ENABLED when a real model exists.
  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://ndr:ndr@postgres:5432/ndr?sslmode=disable
      SENSOR_API_KEY: ${SENSOR_API_KEY:-change-me-sensor-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
      ML_ENABLED: ${ML_ENABLED:-false}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-}
      ATTACK_THRESHOLD: ${ATTACK_THRESHOLD:-0.60}
      DDOS_CRITICAL_THRESHOLD: ${DDOS_CRITICAL_THRESHOLD:-0.85}
      ATTACK_WINDOW: ${ATTACK_WINDOW:-15m}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-100}
      WORKER_COUNT: ${WORKER_COUNT:-2}
      WS_CLIENT_BUFFER: ${WS_CLIENT_BUFFER:-64}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  ndr_pgdata:
